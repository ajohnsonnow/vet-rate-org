name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 🛫 Pre-Flight Check: run locally before pushing with `npm run preflight`
# Quick check (no E2E/build): `npm run preflight:fast`

permissions:
  contents: read

jobs:
  quality:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan past commits
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        # Non-blocking during Sprint 1–2 (pre-existing protobufjs/xmldom advisories
        # tracked in docs/AUDIT_FINDINGS.md, addressed in S8). Flip back to
        # `--audit-level=high` without `|| true` once S8 closes.
        run: npm audit --omit=dev --audit-level=high || true

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup Python (for semgrep)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install semgrep
        run: pip install semgrep

      - name: SAST (semgrep)
        # Non-blocking during Sprint 1–2 (~44 pre-existing findings tracked in
        # docs/AUDIT_FINDINGS.md, fixed in S3). Flip STRICT_SAST to 'true'
        # below once S3 lands so this step blocks the build again.
        env:
          STRICT_SAST: 'false'
        run: |
          node scripts/sast-check.mjs || \
            ( [ "$STRICT_SAST" = "true" ] && exit 1 || echo "::warning::SAST blocking findings (non-strict mode — tracked in AUDIT_FINDINGS.md)" )
