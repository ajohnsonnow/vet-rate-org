name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 🛫 Pre-Flight Check: run locally before pushing with `npm run preflight`
# Quick check (no E2E/build): `npm run preflight:fast`

permissions:
  contents: read

jobs:
  quality:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  red-team:
    name: Red-Team Suite (LLM defenses)
    runs-on: ubuntu-latest
    needs: [quality]
    # Dedicated blocking gate for the prompt-injection / exfiltration /
    # PII-trap / URL-bait payloads under src/__tests__/red-team/. Kept
    # separate from the main test job so a regression here is visible
    # at a glance and bisectable from CI output. Promptfoo / PyRIT were
    # considered and rejected: those tools want a live LLM endpoint to
    # call, which this local-first app does not have in CI (we ship the
    # dual-LLM split, PII scrubber, spotlight wrap, and URL allowlist —
    # all of which are deterministic and testable against vitest mocks).
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run red-team suite (blocking)
        run: npm run test:red-team

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan past commits
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production deps, blocking on high+)
        # Blocking gate as of S8 close — pre-existing protobufjs/xmldom advisories
        # resolved via npm `overrides` in package.json (protobufjs ^7.5.6,
        # @xmldom/xmldom ^0.8.13). If this fails, audit the new advisory and
        # add a targeted override or upgrade the parent dep.
        run: npm audit --omit=dev --audit-level=high

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup Python (for semgrep)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install semgrep
        run: pip install semgrep

      - name: SAST (semgrep, blocking)
        # Blocking as of S8 close — S3 closed the original 44-finding backlog;
        # sast-check.mjs exits 1 on ERROR/WARNING findings. If a new blocker
        # lands, fix it or add a justified suppression in .semgrep.yml.
        run: node scripts/sast-check.mjs --strict
