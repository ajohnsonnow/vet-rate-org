# .github/workflows/codeql.yml
#
# Vet-Rate.org — CodeQL SAST with automatic language detection.
#
# Detects languages from manifest files (package.json, pyproject.toml /
# requirements.txt, *.csproj, go.mod) and builds the analysis matrix
# dynamically — the same file works unchanged across all repos.
#
# Callable as a reusable workflow (workflow_call) from pr-checks.yml (on PRs)
# and release-gates.yml (on push to main) — that is the only way this runs
# on a commit. It also runs standalone weekly (schedule) so new CVE queries
# re-scan existing code, and on workflow_dispatch for a manual re-run.
#
# PINNING: run `pinact run` to pin @vN tags to SHAs before production use.

name: CodeQL Analysis

on:
  # Deliberately no push/pull_request triggers. pr-checks.yml (on PRs) and
  # release-gates.yml (on push to main) both reach this workflow through
  # workflow_call already, so a direct trigger here analysed — and billed —
  # every commit twice (RT13-2, docs/RED_TEAM_AUDIT_2026-06.md:274; see
  # docs/CI_MINUTES.md).
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — catches newly published queries/CVEs
  workflow_call: # allows pr-checks.yml / release-gates.yml to invoke this
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write # upload SARIF to the GitHub Security tab

concurrency:
  group: codeql-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ---------------------------------------------------------- detect-languages --
  detect-languages:
    name: Detect CodeQL languages
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build language matrix from manifest files
        id: detect
        shell: bash
        run: |
          langs='[]'
          add() {
            langs=$(echo "$langs" | jq -c --arg l "$1" --arg b "$2" \
              '. + [{language: $l, "build-mode": $b}]')
          }

          # Interpreted languages: build-mode "none" (no build required)
          if [ -f package.json ]; then
            add javascript-typescript none
          fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then
            add python none
          fi

          # Compiled languages: autobuild (CodeQL traces the build)
          if [ -n "$(find . -name '*.csproj' -not -path './node_modules/*' -print -quit)" ]; then
            add csharp autobuild
          fi
          if [ -f go.mod ]; then
            add go autobuild
          fi

          echo "Detected matrix: $langs"
          echo "matrix=$langs" >> "$GITHUB_OUTPUT"
          echo "any=$(echo "$langs" | jq 'length > 0')" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------- analyze --
  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect-languages
    if: needs.detect-languages.outputs.any == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 45 # compiled-language autobuilds can be slow

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-languages.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds 60+ additional security queries;
          # security-and-quality adds maintainability/reliability checks.
          queries: security-extended,security-and-quality
          # CUSTOMIZE: adjust ignore paths for the project layout
          config: |
            paths-ignore:
              - node_modules
              - dist
              - build
              - vendor
              - '**/*.test.ts'
              - '**/*.spec.ts'
              - tests
              - __tests__

      # If autobuild fails for a compiled language, replace build-mode above
      # with "manual" and add explicit build steps here, e.g.:
      #   - name: Manual build
      #     if: matrix.build-mode == 'manual'
      #     run: dotnet build --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          category: /language:${{ matrix.language }}
          # Results land in GitHub Security → Code scanning.
          # Branch protection on "Code scanning results / CodeQL" makes
          # critical findings block PRs.
