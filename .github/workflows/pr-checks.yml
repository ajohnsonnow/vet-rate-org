# .github/workflows/pr-checks.yml
#
# Vet-Rate.org — Universal PR quality + security gates.
#
# Auto-detects the tech stack (Node.js / Python / .NET / Go) and runs only
# the relevant jobs. Safe to propagate unchanged to any repo.
#
# Blocking gates:  secret-scan, sast-semgrep, sast-codeql, sca-*, supply-chain,
#                  markdown-lint
# Informational:   link-check, perf-budget
#
# lint-and-quality, build and test were removed here (RT13-2 dedupe; see
# docs/CI_MINUTES.md) — ci.yml is the
# canonical gate for lint/type/test/build/e2e/lighthouse on the same
# push+pull_request/main events, and was already running them a second time
# on every commit. The Codecov upload and bundle-budget check those two jobs
# also carried were relocated into ci.yml's test/build jobs rather than
# dropped. visual-regression and ux-perf-check were removed too: the former
# is dead (references a nonexistent playwright-visual.config.ts and failed at
# its preview-server step on every code-touching PR), the latter is an
# informational, non-required duplicate of ci.yml's required `lighthouse` job.
#
# e2e-user-journeys is KEPT: it runs an explicit list of seven specs, chromium
# only, against Playwright's own dev server. They are tests/e2e/{ask-the-regs,
# cfile-canonical-dataflow,document-corpus-import-report,duty-station-map,
# my-packet-summary,palette-axe,simulators-a11y}.spec.ts, which ci.yml's curated
# per-gate spec lists never reference. Removing this job would silently drop
# that coverage. It was repaired on this branch: the old step had no build, ran
# every project (firefox is not installed here) and used an unreachable preview
# server. The old step failed on every code-touching PR, so these specs have
# never run in CI; treat the first run of the repaired step as a trial.
#
# PINNING: tags marked "pinact" should be pinned to commit SHAs before
# production use — run `pinact run` (github.com/suzuki-shunsuke/pinact).

name: PR Checks

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write # PR comments (dependency review, size-limit)
  security-events: write # SARIF upload (CodeQL via reusable workflow)

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22" # CUSTOMIZE: match the project's .nvmrc / engines field

jobs:
  # ---------------------------------------------------------------- detect --
  detect:
    name: Detect stack & changed files
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      has_node: ${{ steps.stack.outputs.has_node }}
      has_python: ${{ steps.stack.outputs.has_python }}
      has_dotnet: ${{ steps.stack.outputs.has_dotnet }}
      has_go: ${{ steps.stack.outputs.has_go }}
      has_build: ${{ steps.stack.outputs.has_build }}
      has_typecheck: ${{ steps.stack.outputs.has_typecheck }}
      has_test: ${{ steps.stack.outputs.has_test }}
      has_size_limit: ${{ steps.stack.outputs.has_size_limit }}
      code: ${{ steps.filter.outputs.code }}
      markdown: ${{ steps.filter.outputs.markdown }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect language manifests & npm scripts
        id: stack
        shell: bash
        run: |
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          if [ -f package.json ]; then out has_node true; else out has_node false; fi
          if [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f setup.py ]; then
            out has_python true
          else
            out has_python false
          fi
          if [ -n "$(find . -name '*.csproj' -not -path './node_modules/*' -print -quit)" ]; then
            out has_dotnet true
          else
            out has_dotnet false
          fi
          if [ -f go.mod ]; then out has_go true; else out has_go false; fi

          if [ -f package.json ]; then
            out has_build       "$(jq -r '.scripts.build != null' package.json)"
            out has_typecheck   "$(jq -r '.scripts.typecheck != null' package.json)"
            out has_test        "$(jq -r '.scripts.test != null' package.json)"
            out has_size_limit  "$(jq -r 'has("size-limit")' package.json)"
          else
            out has_build false
            out has_typecheck false
            out has_test false
            out has_size_limit false
          fi

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            code:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - '**/*.mjs'
              - '**/*.cjs'
              - '**/*.py'
              - '**/*.cs'
              - '**/*.go'
            markdown:
              - '**/*.md'
            workflows:
              - '.github/workflows/**'

  # ----------------------------------------------------------- secret-scan --
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for secret scanning)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CUSTOMIZE: GITLEAKS_LICENSE is required only for org-owned repos
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ---------------------------------------------------------- sast-semgrep --
  sast-semgrep:
    name: SAST (Semgrep)
    needs: detect
    if: needs.detect.outputs.code == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    container:
      image: semgrep/semgrep # pinact: pin to image digest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep scan (diff-aware on PRs)
        run: >
          semgrep ci
          --config p/typescript
          --config p/javascript
          --config p/python
          --config p/owasp-top-ten
          --config p/security-audit
          --config .semgrep/custom-rules.yaml
        env:
          # Optional: connect to Semgrep AppSec Platform for triage/dedup
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ----------------------------------------------------------- sast-codeql --
  sast-codeql:
    name: SAST (CodeQL)
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  # ------------------------------------------------------ sca-dependencies --
  sca-dependency-review:
    name: SCA (dependency review)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # CUSTOMIZE: deny-licenses: GPL-3.0, AGPL-3.0

  sca-osv-scanner:
    name: SCA (OSV-Scanner)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: OSV-Scanner (fails on known vulnerabilities)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./

  # ----------------------------------------------------------- supply-chain --
  supply-chain:
    name: Supply chain (lockfile, actionlint, zizmor)
    needs: detect
    if: needs.detect.outputs.workflows == 'true' || needs.detect.outputs.has_node == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        if: needs.detect.outputs.has_node == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Lockfile integrity (npm ci --dry-run)
        if: needs.detect.outputs.has_node == 'true'
        run: npm ci --dry-run

      - name: actionlint (workflow syntax + shellcheck)
        if: needs.detect.outputs.workflows == 'true'
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: zizmor (workflow security audit)
        if: needs.detect.outputs.workflows == 'true'
        run: |
          pipx install zizmor
          zizmor --format plain .github/workflows/

  # --------------------------------------------------------------- link-check --
  link-check:
    name: Link check (informational)
    needs: detect
    if: needs.detect.outputs.markdown == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          args: --no-progress --max-retries 2 './**/*.md'
          fail: true

  # ------------------------------------------------------------ markdown-lint --
  markdown-lint:
    name: Markdown lint
    needs: detect
    if: needs.detect.outputs.markdown == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@b4c9feab76d8025d1e83c653fa3990936df0e6c8 # v16.0.0
        with:
          globs: |
            **/*.md
            !node_modules/**

  # -------------------------------------------------------------- perf-budget --
  perf-budget:
    name: Performance budget (informational)
    needs: detect
    if: needs.detect.outputs.has_size_limit == 'true'
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: size-limit report (comments on PR)
        # CUSTOMIZE: requires "size-limit" config block in package.json
        uses: andresz1/size-limit-action@e7493a72a44b113341c0cf6186ab49c17c4b65c1 # v1.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------- e2e-user-journeys --
  e2e-user-journeys:
    name: E2E User Journeys
    needs: [detect]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 30
    if: needs.detect.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run E2E tests
        run: >-
          npx playwright test --project=chromium --retries=2 --reporter=html,json
          tests/e2e/ask-the-regs.spec.ts
          tests/e2e/cfile-canonical-dataflow.spec.ts
          tests/e2e/document-corpus-import-report.spec.ts
          tests/e2e/duty-station-map.spec.ts
          tests/e2e/my-packet-summary.spec.ts
          tests/e2e/palette-axe.spec.ts
          tests/e2e/simulators-a11y.spec.ts

      - name: Upload HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload JSON results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/

  # ---------------------------------------------------------- required-checks --
  # Covers the security and docs jobs in this file only. Lint, typecheck, build
  # and test live in ci.yml, so branch protection must require BOTH
  # "CI Gate (required check)" and "PR gate summary".
  required-checks:
    name: PR gate summary
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 5
    if: always()
    needs:
      - secret-scan
      - sast-semgrep
      - sast-codeql
      - sca-dependency-review
      - sca-osv-scanner
      - supply-chain
      - markdown-lint
    steps:
      - name: Verify all blocking gates passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # "skipped" is OK (stack not detected); "failure"/"cancelled" is not.
          if echo "$NEEDS" | jq -e '[.[] | select(.result == "failure" or .result == "cancelled")] | length > 0' > /dev/null; then
            echo "::error::One or more blocking PR gates failed."
            exit 1
          fi
          echo "All blocking gates passed."
