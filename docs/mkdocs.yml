site_name: Vet-Rate.org User Manual
site_description: Comprehensive user documentation for Vet-Rate.org VA Claims Toolkit
site_author: Vet-Rate.org
copyright: Copyright &copy; 2024-2026 Vet-Rate.org - All Rights Reserved

# Theme configuration
theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  palette:
    - scheme: vetrate
      primary: custom
      accent: custom
  font:
    text: Inter
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

# Custom colors matching Vet-Rate.org branding
extra_css:
  - stylesheets/extra.css
  - stylesheets/pdf.css

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://vet-rate.org
      name: Vet-Rate.org Website

# Plugins
plugins:
  - search
  - with-pdf:
      author: Vet-Rate.org
      copyright: Copyright © 2024-2026 Vet-Rate.org. All Rights Reserved.
      cover: true
      back_cover: true
      cover_title: Vet-Rate.org User Manual
      cover_subtitle: Your Complete VA Claims Toolkit
      cover_logo: assets/images/logo.svg
      toc_title: Table of Contents
      enabled_if_env: ENABLE_PDF_EXPORT
      output_path: ../Vet-Rate-User-Manual.pdf
      render_js: true
      headless_chrome_path: chromium-browser

# Markdown extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

