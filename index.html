<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- THE SHIELD - Content Security Policy -->
    <!-- Strict CSP to prevent XSS, code injection, and prompt injection attacks -->
    <!-- cdn.jsdelivr.net allowed for Tesseract.js OCR worker (DD214 PDF processing) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://accounts.google.com https://gc.zgo.at https://cdn.jsdelivr.net blob:;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob: https://*.googleusercontent.com https://www.gravatar.com https://flagcdn.com https://*.flagcdn.com;
        connect-src 'self' data: blob: ws://127.0.0.1:* ws://localhost:* http://127.0.0.1:* http://localhost:* https://generativelanguage.googleapis.com https://api.anthropic.com https://www.googleapis.com https://vet-rate-org.goatcounter.com https://huggingface.co https://*.huggingface.co https://*.hf.co https://*.cdn.hf.co https://*.aws.cdn.hf.co https://*.xethub.hf.co https://raw.githubusercontent.com https://www.federalregister.gov https://sandbox-api.va.gov https://api.va.gov https://cdn.jsdelivr.net https://valighthouse.statuspage.io https://formsubmit.co wasm-unsafe-eval;
        frame-src 'self' https://accounts.google.com https://dos.zone https://cdn.dos.zone https://archive.org;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;
        worker-src 'self' blob: https://cdn.jsdelivr.net;
      "
    />
    
    <meta
      name="description"
      content="Vet-Rate.org - Your complete VA claims arsenal. 39 professional tools: search 748 conditions, calculate ratings, discover secondary claims, AI document analysis, C&P prep, evidence builders, strategic planning. What claim sharks charge $1000s for, FREE. Built by a veteran for veterans."
    />
    <!-- SEO + social cards. The brandingPlugin (vite.config.js) rewrites the
         origin, title, description, logo filename and app name per brand at build. -->
    <link rel="canonical" href="https://vet-rate.org/" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vet-Rate.org" />
    <meta property="og:url" content="https://vet-rate.org/" />
    <meta property="og:title" content="Vet-Rate.org | Complete VA Claims Arsenal - 39 Pro Tools · Rating Calculator · AI Analysis · FREE" />
    <meta property="og:description" content="Vet-Rate.org - Your complete VA claims arsenal. 39 professional tools: search 748 conditions, calculate ratings, discover secondary claims, AI document analysis, C&P prep, evidence builders, strategic planning. What claim sharks charge $1000s for, FREE. Built by a veteran for veterans." />
    <meta property="og:image" content="https://vet-rate.org/images/Vet-Rate-org-logo-official.png" />
    <meta property="og:image:alt" content="VA disability claims toolkit logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vet-Rate.org | Complete VA Claims Arsenal - 39 Pro Tools · Rating Calculator · AI Analysis · FREE" />
    <meta name="twitter:description" content="Vet-Rate.org - Your complete VA claims arsenal. 39 professional tools: search 748 conditions, calculate ratings, discover secondary claims, AI document analysis, C&P prep, evidence builders, strategic planning. What claim sharks charge $1000s for, FREE. Built by a veteran for veterans." />
    <meta name="twitter:image" content="https://vet-rate.org/images/Vet-Rate-org-logo-official.png" />

    <!-- Progressive enhancement: theme-color for Android Chrome/Safari/Edge address bar -->
    <!-- Unsupported browsers (Firefox) safely ignore this meta tag -->
    <!-- htmlhint meta[name=theme-color]:false -->
    <!-- compat-api/html: intentionally used despite partial browser support -->
    <meta name="theme-color" content="#003f87" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1628" media="(prefers-color-scheme: dark)" />
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/images/Vet-Rate-org-logo-official.png" />
    <link rel="shortcut icon" type="image/png" href="/images/Vet-Rate-org-logo-official.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon-180.png" />

    <!-- iOS standalone PWA hints. status-bar-style "default" keeps content below
         the notch/status bar (avoids overlap on surfaces without safe-top). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vet-Rate.org" />

    <!-- Preload the LCP hero (Header + splash logo) so it paints without waiting on the JS bundle. -->
    <link
      rel="preload"
      as="image"
      href="/images/Vet-Rate-org-logo-official.png"
      fetchpriority="high"
    />

    <!-- PWA manifest — installable + offline shell (closes AUDIT_FINDINGS #27). -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Flag Icons CSS - Proper flag rendering instead of broken emoji flags -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css" />
    
    <title>Vet-Rate.org | Complete VA Claims Arsenal - 39 Pro Tools · Rating Calculator · AI Analysis · FREE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Google Drive API (for Cloud Sync) -->
    <script src="https://apis.google.com/js/api.js" async defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <script data-goatcounter="https://vet-rate-org.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
