      knowledgeQuery.queryCorpus (S30) once populated (npm run refresh:cavc-shard).
      SCOPE + REMAINING before verified_status: verified — (1) the RSS is a small
      rolling window (last few days) of non-precedential MEMORANDUM decisions, so
      it keeps the shard FRESH but is not the historical archive; the 2007-2023
      published-opinion backfill (the archive-audit gap) comes from
      search.uscourts.cavc.gov (POST /search/, IW_DATABASE="USCAVC Opinions") +
      efiling CaseSummary.jsp bodies and is a separate time/compute-gated job
      (documented in fetch-cavc.mjs, not built this sprint). (2) weekly cron
      green end-to-end twice (freshness/CI wiring is S39). The offline corpus
      already carries 6,422 legacy cavc entries (low-fidelity synthetic guidance
      blurbs, placeholder homepage URLs) that this real feed supersedes for fresh
      decisions.
      S39 (2026-07-15): weekly freshness CI wired via scripts/dkb-sharding/check-shard-freshness.mjs, .github/workflows/dkb-freshness.yml.
      S43 (2026-07-19): built fetch-cavc-historical.mjs against search.uscourts.cavc.gov's real
      ISYS search server (plain HTTP; IW_DATABASE=PanelDecisions/SingleJudgeDecisions is the
      site's own precedential/non-precedential split). PanelDecisions backfill COMPLETE — 1,363
      decisions, fully embedded. SingleJudgeDecisions backfill (~50,700 docs) NOT complete — the
      archive server had a genuine, confirmed outage mid-run (independently verified with a real
      browser); paused rather than left retrying unattended. Shard currently carries only 29
      single_judge-tagged chunks from the small rolling feed. Every chunk is tagged
      decision_type/precedential/citation_weight (src/services/cavcAuthorityTagging.js) so a
      memorandum decision can never rank or render as citable precedent. Resume via
      CAVC_HIST_DATABASES=SingleJudgeDecisions once the server is healthy — see
      build-cavc-shard.mjs's header for the exact command.

  - id: fedcir
