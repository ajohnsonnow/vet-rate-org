    api_endpoint: https://www.cafc.uscourts.gov/wp-json/wp/v2/posts?categories=27
    refresh_cadence: weekly
    fetcher: scripts/legal-ingestion/fetch-fedcir.mjs
    shard_builder: scripts/dkb-sharding/build-fedcir-shard.mjs
    shard: public/dkb-index/fedcir/
    authority_tier: judicial_federal_circuit
    verified_status: content-verified
    last_verified: 2026-07-18
    notes: |
      S33 (2026-07-15) promoted the old placeholder scaffold to a real fetcher.
      cafc.uscourts.gov is WordPress; its opinions/orders are posts in category
      27 ("Opinion-Order", ~18.7K posts) exposed via the standard WP REST API
      (/wp-json/wp/v2/posts?categories=27) — plain fetch(), no browser. NOTE the
      host must be www.cafc.uscourts.gov (apex fails SNI). fetch-fedcir.mjs pages
      the API and keeps only veterans-law appeals via the post's "Origin:" field
      (CAVC or DVA — a live page-1 sample was 12/100 veterans-origin); default
      body is a synopsis + PDF link, --with-pdf-text opts into full pdfjs-dist
      opinion-text extraction (heavy path). The shard (public/dkb-index/fedcir/,
      judicial_federal_circuit tier) is built by build-fedcir-shard.mjs, which
      MERGES the live feed with a hand-verified seed of 24 load-bearing
      veterans-law precedents (scripts/legal-ingestion/fedcir-key-cases.mjs —
      Procopio, Buchanan, Jandreau, Hodge, Wagner, Martin v. O'Rourke, …) each
      carrying its real F.3d/F.4th reporter cite, so the shard covers the anchor
      cases even before a full historical backfill. npm run refresh:fedcir-shard.
      REMAINING before verified_status: verified — (1) full historical crawl
      (~188 REST pages) + optional PDF-text extraction committed as the shard;
      (2) weekly cron green twice (freshness/CI is S39). Replaces the 293
      low-fidelity synthetic federal_circuit corpus entries (many mis-tagged
      CAVC cases with search-URL placeholders).
      S39 (2026-07-15): weekly freshness CI wired via scripts/dkb-sharding/check-shard-freshness.mjs, .github/workflows/dkb-freshness.yml.

