      canonical per-year-index url (implausible-year guard rejects malformed
      source cites) so 0 entries are skipped url-less (verified in a bounded
      build). npm run refresh:ogc-shard. REMAINING before verified_status:
      verified — (1) full all-years crawl + optional PDF-text committed as the
      shard; (2) weekly cron green twice (freshness/CI is S39).
      S39 (2026-07-15): weekly freshness CI wired via scripts/dkb-sharding/check-shard-freshness.mjs, .github/workflows/dkb-freshness.yml.

  - id: bva
    name: Board of Veterans' Appeals — decisions (non-precedential)
    jurisdiction: va
    canonical_url: https://www.va.gov/vetapp/
    api_endpoint: null
    refresh_cadence: quarterly
    fetcher: null
    shard_builder: scripts/dkb-sharding/build-bva-shard.mjs
    shard: public/dkb-index/bva/
    authority_tier: administrative_precedent
    verified_status: content-verified
    last_verified: 2026-07-18
    notes: |
      S32 (2026-07-15): the 116,209 BVA entries already in the offline corpus
      (source:"bva", individual decisions at va.gov/vetappYY/…txt) are built
      into their own shard (public/dkb-index/bva/) with per-entry authority
      tagging (src/services/bvaAuthorityTagging.js). Board decisions are
      CATEGORICALLY non-precedential under 38 CFR § 20.1303 ("binding only with
      regard to the specific case decided"), so every entry is tagged
      precedential:false / binding:false / authority_basis:"38 CFR § 20.1303"
      (INVARIANT, not inferred) plus a persuasive citation_weight ∈ [0,1]
      (recency + grounding-in-binding-authority + disposition + substance) for
      ranking, and a caveat surfaced at citation time. This replaces the old
      blanket "would inflate the index 100x" exclusion: index everything, never
      let it read as binding authority (unit-asserted). No live fetcher — the
      data is corpus-sourced; refresh_cadence tracks corpus regeneration.
      REMAINING before verified: full 116K bge-small embed committed as the
      shard (~45 MB, ~2 parts; time/compute-heavy) + build-registry.mjs.
      S39 (2026-07-15): weekly freshness CI wired via scripts/dkb-sharding/check-shard-freshness.mjs, .github/workflows/dkb-freshness.yml.

