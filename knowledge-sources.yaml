# knowledge-sources.yaml — registry of authoritative sources the
# legal-index ingestion pipeline pulls from.
#
# Per knowledge-monitoring-best-practices.md, every long-lived knowledge
# base needs an external-truth registry that maps {what we cite} → {where
# the canonical version lives} so a freshness check can fail loudly when
# a source drifts.
#
# Read by: `.github/workflows/legal-ingestion.yml` (informational — the
# fetchers hard-code their own URLs for now); also by `.github/workflows/dkb-freshness.yml`
# (S39 — freshness CI compares `last_verified` against `refresh_cadence`-derived staleness thresholds).
#
# Each entry shape:
#   id:               kebab-case unique key matching the manifest source name
#   name:             human-readable title
#   jurisdiction:     federal | va | court
#   canonical_url:    where a human reads the authoritative version
#   api_endpoint:     where the fetcher pulls from
#   refresh_cadence:  weekly | monthly | quarterly | event-driven
#   fetcher:          path to the script that ingests this source
#   verified_status:  verified (live and tested, in the weekly cron) |
#                     content-verified (fetcher live-tested end-to-end against
#                     the real source, pending full shard population + two green
#                     cron runs before promotion to verified) | scaffold
#                     (fetcher exists, URL needs probing) | not_started (source
#                     identified, no fetcher built yet)
#   last_verified:    ISO date of the last successful end-to-end run

version: 1
sources:
  - id: ecfr
    name: Electronic Code of Federal Regulations — Title 38
    jurisdiction: federal
    canonical_url: https://www.ecfr.gov/current/title-38
    api_endpoint: https://www.ecfr.gov/api/versioner/v1/structure/{date}/title-38.json
    api_endpoint_renderer: https://www.ecfr.gov/api/renderer/v1/content/enhanced/{date}/title-38?part={part}&section={section}
    refresh_cadence: weekly
    fetcher: scripts/legal-ingestion/fetch-ecfr.mjs
    verified_status: verified
    last_verified: 2026-07-09
    parts_in_scope: ["3", "4", "19", "20"]
    parts_currently_indexed: ["3", "4", "19", "20"]
    notes: |
      S25 (2026-07-09): all four in-scope parts are now fetched and
      indexed (fetch-ecfr.mjs's DEFAULT_PARTS already covered all four;
      prior runs had just been explicitly scoped to --part=4). 564 records
      -> 1,060 chunks, 2.6 MB total (well under the 25 MB budget). CAVC and
      Federal Circuit are NO LONGER out of scope — S33 (2026-07-15) shipped
      real fetchers for both into their own shards (see the cavc/fedcir
      entries below).
      S35 (2026-07-15): the verified Part 4 rating schedule in this index is
      the authoritative source for the structured rating criteria backfilled
      into src/data/disabilityData.json — 176 previously-uncovered diagnostic
      codes (amputations 51xx, ankylosis/limitation-of-motion 52xx, muscle
      groups 4.73, peripheral nerves/epilepsy/eating disorders 4.124a/4.130,
      renal/skin) now carry structured criteria extracted verbatim from these
      chunks (every percentage re-verified against the source; nerves rate via
      their paralysis parent per 4.123/4.124 caps). 0 of 748 codes remain
      prose-only. Guarded by src/__tests__/ratingCriteriaCoverage.test.js.

  - id: m21-1
    name: VA M21-1 Adjudication Procedures Manual
    jurisdiction: va
    canonical_url: https://www.knowva.ebenefits.va.gov/system/templates/selfservice/va_ssnew/help/customer/locale/en-US/portal/554400000001018/topic/554400000004049/M21-1-Adjudication-Procedures-Manual
    api_endpoint: https://www.knowva.ebenefits.va.gov/system/ws/v11/ss/
    refresh_cadence: monthly
    fetcher: scripts/legal-ingestion/fetch-m21-1.mjs
    shard_builder: scripts/dkb-sharding/build-m21-1-shard.mjs
    shard: public/dkb-index/m21_1/
    verified_status: content-verified
    last_verified: 2026-07-18
    notes: |
      S31 (2026-07-15) SOLVED the S25 blocker. KnowVA serves M21-1 as a
      client-side Angular SPA (a plain fetch of the page HTML returns only a
      "JavaScript is not enabled" shell — confirmed again), so the old
      fetch()+regex scaffold got ZERO content. S31 took the plan's PREFERRED
      path — reverse-engineering the content API instead of adding a headless
      browser: a one-off Playwright render (Playwright is already a devDep for
      e2e; NOT a new runtime dependency) sniffed the SPA's XHR calls and
      revealed a clean, stable KANA/Verint "Self Service v11" JSON REST API
      that plain fetch() CAN read (no browser, no session cookie):
        - topic tree:  GET /system/ws/v11/ss/topic/{id}?$level=2&portalId=…
                       (BFS one level at a time — deep $level is rejected)
        - article text: GET /system/ws/v11/ss/article?$attribute=…,contentText
                       &topicId={leaf}&portalId=…  → real HTML body per article
      fetch-m21-1.mjs now drives that API (root topic 554400000004049 reports
      articleTotalCount≈785; a bounded live run pulled real Memorandum-of-
      Changes / adjudication text, sanitized, gov-URL-preserved). Coverage
      floor M21_MIN_ARTICLES=600 on full runs; M21_MAX_ARTICLES caps bounded
      verification. Output lands in its OWN shard (public/dkb-index/m21_1/,
      procedural tier) via build-m21-1-shard.mjs — deliberately NOT the eCFR
      legal-index monolith, so "Ask the Regs" retrieval stays regression-free
      (S29). Queryable through knowledgeQuery.queryCorpus (S30) once the shard
      is populated + registered (npm run refresh:m21-1-shard).
      REMAINING before verified_status: verified — (1) a full uncapped
      population run (fetch 785 + real bge-small embed) committed as the shard;
      (2) the weekly ingestion cron running the M21-1 shard pipeline green
      end-to-end at least twice (inherently multi-week; the freshness/CI wiring
      across all shards is S39's scope). ENABLE_SCAFFOLD_FETCHERS no longer
      applies — this is a real fetcher, not a scaffold.
      S39 (2026-07-15): weekly freshness CI wired via scripts/dkb-sharding/check-shard-freshness.mjs, .github/workflows/dkb-freshness.yml.

