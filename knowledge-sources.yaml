  - id: rate-tables
    name: VA disability compensation + Special Monthly Compensation (SMC) rates
    jurisdiction: va
    canonical_url: https://www.knowva.ebenefits.va.gov/system/templates/selfservice/va_ssnew/help/customer/locale/en-US/portal/554400000001018/topic/554400000005316/Rate-Tables
    api_endpoint: https://www.knowva.ebenefits.va.gov/system/ws/v11/ss/
    refresh_cadence: annual
    fetcher: scripts/legal-ingestion/fetch-rate-tables.mjs
    shard_builder: null
    shard: null
    output: src/data/vaSmcRatesHistorical.js (generated by apply-smc-rates.mjs)
    authority_tier: primary
    verified_status: content-verified
    last_verified: 2026-07-20
    notes: |
      S44 (2026-07-20): investigated whether KnowVA's Rate Tables (same
      portal as M21-1/M21-5) would be better than the app's existing
      src/data/vaPayRatesHistorical.js. Not a replacement — the app's
      existing 2020-2026 base compensation numbers are correct and match
      KnowVA's CURRENT-year article exactly — but KnowVA had one real gap:
      zero Special Monthly Compensation (SMC) rate data existed in the app
      before this.
      SCOPE DECISION — current year only: cross-validating every parsed
      value against vaPayRatesHistorical.js's existing (already va.gov-
      verified) entries found the 2025 COLA Rates article (-> app year
      2026) matches EXACTLY, zero discrepancies. But the SAME check against
      KnowVA's archived 2017-2024 COLA articles (-> app years 2018-2025)
      found real discrepancies of up to ~$1 on some cells, in both directly-
      read values and derived deltas — not a parser bug (checked raw table
      cells by hand). KnowVA's own historical archive appears to carry small
      inconsistencies for past years that the app's existing data doesn't
      have. Given this feeds real compensation-underpayment math shown to
      veterans, only the current year shipped (user decision). Historical
      fetch/parse still runs behind RATE_TABLES_INCLUDE_HISTORICAL=1 for a
      future session to revisit if a second independent source appears.
      Also out of scope: pre-2014 rates (1933-2014) exist only as PDF
      attachments with no discoverable download API (probed several
      plausible REST paths, all 400/404 — would need browser-based network
      capture); Special Benefit Allowances / Spina Bifida / Birth Defects
      tables are present in the same articles but their section labels sit
      in irregularly-nested HTML, skipped rather than risk mislabeling.
      apply-smc-rates.mjs cross-validates before writing and refuses to
      generate the output file on any mismatch — this stays load-bearing
      for future annual COLA updates, not just this one-time check.

