    verified_status: content-verified
    last_verified: 2026-07-18
    notes: |
      S34 (2026-07-15) built the real fetcher (S27 had only registered the
      source; no fetcher existed). The precedent-opinion archive is a stable
      plain-fetch two-level crawl — landing precedentopinions.asp → per-year
      index pages /OGC/opinions/<yyyy>PrecedentOpinions.asp (30 years, 1987-2019
