    shard: public/dkb-index/cavc/
    authority_tier: judicial
    verified_status: content-verified
    last_verified: 2026-07-18
    notes: |
      S33 (2026-07-15) promoted the old placeholder scaffold to a real fetcher.
      The recent_decisions.php page renders its decision list client-side (empty
      <tbody id="decision_feed">), but the same data is served as a plain,
      fetch()able Atom feed at /data/recentdecisions.rss — no headless browser.
