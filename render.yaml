services:
  # Vet-Rate.org - Free Version
  - type: web
    name: vet-rate-org
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_BRAND_MODE
        value: vetrate
      # VA.gov OAuth Configuration (set values in Render Dashboard)
      - key: VITE_VA_AUTH_ID
        sync: false  # Set in Render Dashboard (sensitive)
      - key: VITE_VA_REDIRECT_URL
        value: https://vet-rate.org/callback
      - key: VITE_VA_API_ENV
        value: sandbox
      - key: VITE_VA_OAUTH_API_PATH
        value: veteran-verification/v1
      # VA API Keys (set values in Render Dashboard)
      - key: VITE_VA_API_KEY
        sync: false  # Set in Render Dashboard (sensitive)
      - key: VITE_VA_FORMS_API_KEY
        sync: false  # Set in Render Dashboard (sensitive)
      - key: VITE_VA_BENEFITS_REF_API_KEY
        sync: false  # Set in Render Dashboard (sensitive)
    headers:
      # RT8-1: COOP + COEP enable crossOriginIsolated, required for
      # SharedArrayBuffer (Tesseract.js multi-thread, wllama). COEP uses
      # "credentialless" (not "require-corp") so third-party assets (CDN fonts,
      # Hugging Face model weights, GoatCounter analytics) load without needing
      # CORP headers. COOP same-origin closes the opener channel.
      # FLAG: owner should verify CDN/HF fetches load correctly in prod before
      # enabling on main. Test with: window.crossOriginIsolated === true in console.
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # D-M16: X-XSS-Protection removed — deprecated; the legacy auditor can
      # introduce XSS on some browsers. CSP below is the real defense.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://apis.google.com https://accounts.google.com https://gc.zgo.at https://cdn.jsdelivr.net blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.googleusercontent.com https://www.gravatar.com https://flagcdn.com https://*.flagcdn.com; connect-src 'self' data: blob: https://generativelanguage.googleapis.com https://api.anthropic.com https://www.googleapis.com https://vet-rate-org.goatcounter.com https://huggingface.co https://*.huggingface.co https://*.hf.co https://*.cdn.hf.co https://*.aws.cdn.hf.co https://*.xethub.hf.co https://raw.githubusercontent.com https://www.federalregister.gov https://sandbox-api.va.gov https://api.va.gov https://api.dropboxapi.com https://content.dropboxapi.com https://login.microsoftonline.com https://graph.microsoft.com https://cdn.jsdelivr.net https://valighthouse.statuspage.io https://formsubmit.co; frame-src 'self' https://accounts.google.com https://dos.zone https://cdn.dos.zone https://archive.org; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; worker-src 'self' blob: https://cdn.jsdelivr.net"
      # D-M15: HSTS — force HTTPS for a year incl. subdomains (no preload: keeps
      # this reversible without an HSTS-preload-list removal request).
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.js
        name: Content-Type
        value: application/javascript; charset=utf-8
      - path: /*.css
        name: Content-Type
        value: text/css; charset=utf-8
    routes:
      # SPA client-side routing - serve index.html for all non-asset paths
      - type: rewrite
        source: /callback
        destination: /index.html
      - type: rewrite
        source: /sandbox-test
        destination: /index.html

  # Supply Locker - Supporter Version (same codebase, different branding)
  - type: web
    name: supply-locker
    runtime: static
    buildCommand: npm install && npm run build:supplylocker
    staticPublishPath: ./dist-supplylocker
    envVars:
      - key: VITE_BRAND_MODE
        value: supplylocker
    headers:
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
      - path: /*
