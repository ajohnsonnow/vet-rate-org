services:
  # Vet-Rate.org - Free Version
  - type: web
    name: vet-rate-org
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_BRAND_MODE
        value: vetrate
      # VA.gov OAuth Configuration (set values in Render Dashboard)
      - key: VITE_VA_AUTH_ID
        sync: false  # Set in Render Dashboard (sensitive)
      - key: VITE_VA_REDIRECT_URL
        value: https://vet-rate.org/callback
      - key: VITE_VA_API_ENV
        value: sandbox
      - key: VITE_VA_OAUTH_API_PATH
        value: veteran-verification/v1
      # VA API Keys (set values in Render Dashboard)
      - key: VITE_VA_API_KEY
        sync: false  # Set in Render Dashboard (sensitive)
      - key: VITE_VA_FORMS_API_KEY
        sync: false  # Set in Render Dashboard (sensitive)
      - key: VITE_VA_BENEFITS_REF_API_KEY
        sync: false  # Set in Render Dashboard (sensitive)
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.js
        name: Content-Type
        value: application/javascript; charset=utf-8
      - path: /*.css
        name: Content-Type
        value: text/css; charset=utf-8
    routes:
      # SPA client-side routing - serve index.html for all non-asset paths
      - type: rewrite
        source: /callback
        destination: /index.html
      - type: rewrite
        source: /sandbox-test
        destination: /index.html

  # Supply Locker - Supporter Version (same codebase, different branding)
  - type: web
    name: supply-locker
    runtime: static
    buildCommand: npm install && npm run build:supplylocker
    staticPublishPath: ./dist-supplylocker
    envVars:
      - key: VITE_BRAND_MODE
        value: supplylocker
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), microphone=(), camera=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.js
        name: Content-Type
        value: application/javascript; charset=utf-8
      - path: /*.css
        name: Content-Type
        value: text/css; charset=utf-8
