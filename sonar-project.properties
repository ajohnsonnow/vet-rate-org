sonar.projectKey=vet-rate-org
sonar.projectName=Vet-Rate.org
sonar.sourceEncoding=UTF-8

# Tests live beside the code (src/__tests__, *.test.js) and in tests/.
sonar.sources=src
sonar.tests=src,tests
sonar.exclusions=**/*.test.js,**/*.test.jsx,**/*.spec.ts,**/__tests__/**,**/*.json,**/*.backup
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.ts,**/__tests__/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.cpd.exclusions=**/__tests__/**,**/*.test.*,**/*.spec.*
