<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>device-lab layout check</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <iframe id="app" title="app"></iframe>
    <script>
      (function () {
        var q = new URLSearchParams(location.search);
        var runId = q.get("run");
        var post = function (payload) {
          payload.runId = runId;
          return fetch("/__device-lab/result", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(payload),
          });
        };
        fetch("/package.json")
          .then(function (r) {
            return r.json();
          })
          .then(function (pkg) {
            localStorage.setItem("vet-rate-tos-accepted", "true");
            localStorage.setItem("vet_rate_last_seen_version", pkg.version);
            localStorage.setItem("vetrate-tour-completed", "true");
            localStorage.setItem("vetrate_disclaimer-acknowledged", "true");
            localStorage.setItem("vetrate_affiliation-prompt-seen", "true");
            var frame = document.getElementById("app");
            frame.src = "/";
            setTimeout(function () {
              var out = {
                stage: "layout",
                outerInner: { w: innerWidth, h: innerHeight },
              };
              try {
                var win = frame.contentWindow;
                var doc = frame.contentDocument;
                var root = doc.documentElement;
                out.frame = {
                  innerWidth: win.innerWidth,
                  clientWidth: root.clientWidth,
                  scrollWidth: root.scrollWidth,
                  bodyScrollWidth: doc.body.scrollWidth,
                  horizontalScroll:
                    root.scrollWidth > root.clientWidth + 1 ||
                    doc.body.scrollWidth > root.clientWidth + 1,
                  title: doc.title,
                  headingText:
                    (doc.querySelector("h1") || {}).textContent || null,
                  dialogOpen: Boolean(doc.querySelector('[role="dialog"]')),
                };
              } catch (e) {
                out.error = String(e);
              }
              post(out).then(function () {
                return post({ stage: "done" });
              });
            }, 12000);
          });
      })();
    </script>
  </body>
</html>
